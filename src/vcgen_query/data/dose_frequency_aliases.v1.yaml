# Reviewed dose frequencies for the `dose_frequency` derived field.
#
# The archive records one dosing frequency with several spellings (EXDOSFRQ
# "QD" and "QD – Once daily"; TS PDOSFRQ "DAILY" and "Once daily"). Each entry
# gives one canonical frequency and the exact source spellings that map to it.
# The `dose_frequency` field selects a subject when one of its exposure
# frequencies (EX rows, or the TS PDOSFRQ values of a subject without EX rows)
# maps to the requested canonical frequency. `/vcgen/population` offers the
# canonical frequencies.
#
# Matching: spellings are compared after whitespace collapse, trim, and
# upper-casing. Only the spellings below match. A spelling that is not in this
# file maps to no frequency, so it matches no frequency request.
#
# `unmapped` lists spellings that were reviewed and must not map to a
# frequency, with the reason. `evidence` records the EX and TS subjects and
# studies of the spelling in the reviewed source; it is review evidence only
# and does not change matching.
#
# Review rule: when the source archive changes (`rodent_db_export.zip.dvc`),
# list the spellings that map to no frequency (see `frequency_alias_inventory`),
# add or reject each one here, and update `reviewed_source`. The file hash is
# part of the predicate fingerprint of each query that uses `dose_frequency`.
contract: vcgen.dose_frequency_aliases.v1
reviewed_source:
  archive: rodent_db_export.zip
  dvc_md5: 6b1a42fc119c2d537b6f4e0ec4cac262
analysis:
  inventory: Distinct EXDOSFRQ and TS PDOSFRQ spellings, with subject and study counts per source.
  rule: >-
    One canonical frequency per dosing schedule, spelled as the most frequent
    EXDOSFRQ value of that schedule. A SEND abbreviation, an English phrase and
    an ISO 8601 period (P7D, P14D, P4W) of the same schedule map to it. TWICE
    and THRICE count administrations in the study and stay apart from BID and
    TID. A value that lists dosing days, combines frequencies, or describes a
    changing schedule is not mapped.
