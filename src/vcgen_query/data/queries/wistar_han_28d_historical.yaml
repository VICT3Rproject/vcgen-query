# yaml-language-server: $schema=../vcgen.cohort_query.v4.schema.json
# Broad discovery predicate and separate SEND-observation contract.
#
# This source-acquisition profile selects subjects with the 28-day
# dose-duration semantics. Do not use it as the generation profile.
# Observation extraction retains source study days; it does not infer terminal
# windows from dose duration.

contract: vcgen.cohort_query.v4
query_id: wistar_han_28d_historical_discovery
predicate:
  group: and
  children:
  - field: {kind: derived, name: dose_duration_days, value_type: number}
    operator: between
    value: [28, 28]
  - field: {kind: derived, name: study_start_year, value_type: number}
    operator: between
    value: [2017, 2025]
  - field: {kind: derived, name: species, value_type: string}
    operator: eq
    value: RAT
  - field: {kind: derived, name: sex, value_type: string}
    operator: in
    value: [F, M]
  - field: {kind: derived, name: strain, value_type: string}
    operator: eq
    value: WISTAR HAN
  - field: {kind: derived, name: route, value_type: string}
    operator: in
    value: [ORAL, ORAL GAVAGE]

observation_contract:
