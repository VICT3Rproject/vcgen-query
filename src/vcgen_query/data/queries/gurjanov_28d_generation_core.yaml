# yaml-language-server: $schema=../vcgen.cohort_query.v4.schema.json
# Production cohort with the locally supported Gurjanov generation core.
contract: vcgen.cohort_query.v4
query_id: gurjanov_28d_generation_core
predicate:
  group: and
  children:
  - field:
      kind: derived
      name: dose_duration_days
      value_type: number
    operator: between
    value:
    - 28
    - 28
  - field:
      kind: derived
      name: species
      value_type: string
    operator: eq
    value: RAT
  - field:
      kind: derived
      name: sex
      value_type: string
    operator: in
    value:
    - F
    - M
  - field:
      kind: derived
      name: strain
      value_type: string
    operator: eq
    value: WISTAR HAN
  - field:
      kind: derived
      name: route
      value_type: string
    operator: in
    value:
    - ORAL
    - ORAL GAVAGE
  - field:
      kind: derived
      name: study_start_year
      value_type: number
    operator: between
    value:
    - 2017
    - 2022
  - field:
      kind: send_column
      domain: EX
      column: EXDOSE
      value_type: number
    operator: eq
    value: 0
  - field:
      kind: derived
      name: study_type
      value_type: string
    operator: eq
    value: REPEAT DOSE TOXICITY
  - field:
      kind: derived
      name: dose_frequency
      value_type: string
    operator: eq
    value: QD
  - field:
      kind: send_column
      domain: DM
      column: ARM
      value_type: string
    operator: not_contains
    value: RECOVERY
  - field:
      kind: send_column
      domain: DM
      column: ARM
      value_type: string
    operator: not_contains
    value: :RP
  - field:
      kind: send_column
      domain: DM
      column: ARM
      value_type: string
    operator: not_contains
    value: OFF-DOSE
  - field:
      kind: send_column
      domain: DM
      column: ARM
      value_type: string
    operator: not_contains
    value: TK
