# yaml-language-server: $schema=../vcgen.cohort_query.v5.schema.json
# Endpoint source selectors are resolved by the package catalogue.
contract: vcgen.cohort_query.v5
query_id: gurjanov_28d_generation_core
predicate:
  group: and
  children:
  - field:
      kind: derived
      name: planned_dose_duration_days
      value_type: number
    operator: between
    value:
    - 28
    - 28
  - field:
      kind: derived
      name: species
      value_type: string
    operator: eq
    value: RAT
  - field:
      kind: derived
      name: sex
      value_type: string
    operator: in
    value:
    - F
    - M
  - field:
      kind: derived
      name: strain
      value_type: string
    operator: eq
    value: WISTAR HAN
  - field:
      kind: derived
      name: route
      value_type: string
    operator: in
    value:
    - ORAL
    - ORAL GAVAGE
  - field:
      kind: derived
      name: study_start_year
      value_type: number
    operator: between
    value:
    - 2017
    - 2022
  - field:
      kind: send_column
      domain: EX
      column: EXDOSE
      value_type: number
    operator: eq
    value: 0
  - field:
      kind: derived
      name: study_type
      value_type: string
    operator: eq
    value: REPEAT DOSE TOXICITY
  - field:
      kind: derived
      name: dose_frequency
      value_type: string
    operator: eq
    value: QD
  - field:
      kind: send_column
      domain: DM
      column: ARM
      value_type: string
    operator: not_contains
    value: RECOVERY
  - field:
      kind: send_column
      domain: DM
      column: ARM
      value_type: string
    operator: not_contains
    value: :RP
  - field:
      kind: send_column
      domain: DM
      column: ARM
      value_type: string
    operator: not_contains
    value: OFF-DOSE
  - field:
      kind: send_column
      domain: DM
      column: ARM
      value_type: string
    operator: not_contains
    value: TK
assumptions:
- EXDOSE = 0 identifies control subjects in this archive.
- QD repeat-dose studies from 2017 through 2022 form the full train and evaluation
  eligibility window for legacy studies initiated in 2021 or 2022; study-level splitting
  controls leakage.
- A non-missing DM.ARM without recovery, RP, off-dose, or TK labels identifies the
  primary analysis arm.
- Core endpoints use Gurjanov endpoint families with at least 68 percent numeric support
  in the selected local cohort, assessed within sex for sex-specific organs.
warnings:
- This multi-sponsor archive is not the Bayer Wuppertal HCD repository used by Gurjanov
  et al.
- Facility, breeder, vehicle, housing, and target initial-body-weight matching remain
  target-study filters; vehicle is missing or redacted for most eligible subjects.
