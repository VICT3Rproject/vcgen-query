assumptions:
- EXDOSE = 0 identifies control subjects in this archive.
- QD repeat-dose studies from 2017 through 2022 form the full train and evaluation eligibility window
  for legacy studies initiated in 2021 or 2022; study-level splitting controls leakage.
- A non-missing DM.ARM without recovery, RP, off-dose, or TK labels identifies the primary analysis arm.
- Core endpoints use Gurjanov endpoint families with at least 68 percent numeric support in the selected
  local cohort, assessed within sex for sex-specific organs.
warnings:
- This multi-sponsor archive is not the Bayer Wuppertal HCD repository used by Gurjanov et al.
- Facility, breeder, vehicle, housing, and target initial-body-weight matching remain target-study filters;
  vehicle is missing or redacted for most eligible subjects.
