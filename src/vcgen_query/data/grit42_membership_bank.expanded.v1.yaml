contract: vcgen.grit42_membership_bank.v1
name: grit42-expanded-query-semantics
seed_study_id: "481152"
source_domains: [DM, EX, TS, LB]
scout_source_identity: grit42-study-slice-sha256:36380b33a1143d732cb13fba6026341e40e55eeedafbea9cd614edaf7a4aa188

# These rules keep every preview within one ten-subject control group. In the
# Advanced UI, select STUDYID, SEX, STRAIN, RFSTDTC, EXDOSE, TSPARMCD, TSVAL,
# LBTESTCD, LBSTRESN, LBMETHOD, and LBDRVFL before creating saved queries.
base_rules:
- field: {kind: send_column, domain: DM, column: STUDYID, value_type: string}
  operator: eq
  value: "481152"
- field: {kind: send_column, domain: EX, column: EXDOSE, value_type: number}
  operator: eq
  value: 0.0

cases:
- id: baseline
  title: Narrow study and control-dose baseline
  intent: Establish the common ten-subject set using DM and EX.
  scout_expected_count: 10

- id: study_grain
  title: Trial-summary study-grain filter
  intent: Test whether matching TS rows propagate to every subject in the study.
  scout_expected_count: 10
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: TS, column: TSPARMCD, value_type: string}
      operator: eq
      value: SSTYP
    - field: {kind: send_column, domain: TS, column: TSVAL, value_type: string}
      operator: eq
      value: REPEAT DOSE TOXICITY

- id: male
  title: Male subjects
  intent: Test a subject-grain DM categorical condition.
  scout_expected_count: 5
  condition:
    field: {kind: send_column, domain: DM, column: SEX, value_type: string}
    operator: eq
    value: M

- id: not_male
  title: Negated male group
  intent: Test group-level NOT on a subject-grain DM condition.
  scout_expected_count: 5
  condition:
    group: and
    negated: true
    children:
    - field: {kind: send_column, domain: DM, column: SEX, value_type: string}
      operator: eq
      value: M

- id: alt
  title: Subjects with ALT rows
  intent: Test subject membership from a repeated laboratory domain.
  scout_expected_count: 3
  condition:
    field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
    operator: eq
    value: ALT

- id: ast
  title: Subjects with AST rows
  intent: Test a second overlapping laboratory subject set.
  scout_expected_count: 7
  condition:
    field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
    operator: eq
    value: AST

- id: alt_or_ast
  title: Subjects with ALT or AST rows
  intent: Test union semantics across two repeated-domain predicates.
  scout_expected_count: 8
  condition:
    group: or
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: ALT
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST

- id: alt_and_ast
  title: Subjects with ALT and AST rows
  intent: Verify that two rules in one repeated-domain group share one row.
  scout_expected_count: 0
  diagnostic_alternative_count: 2
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: ALT
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST

- id: ast_and_any_numeric
  title: AST and any LB value above 1.8
  intent: Distinguish subject-set intersection from same-row conjunction.
  scout_expected_count: 4
  diagnostic_alternative_count: 5
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST
    - field: {kind: send_column, domain: LB, column: LBSTRESN, value_type: number}
      operator: gt
      value: 1.8

- id: ast_and_numeric_separate_groups
  title: AST and numeric threshold in separate groups
  intent: Verify that grit42 group boundaries create independent subject sets.
  scout_expected_count: 5
  conditions:
  - group: and
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST
  - group: and
    children:
    - field: {kind: send_column, domain: LB, column: LBSTRESN, value_type: number}
      operator: gt
      value: 1.8

- id: empty_lb_method
  title: Subjects with an empty laboratory method
  intent: Test null and empty-string behavior in a repeated domain.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: LB, column: LBMETHOD, value_type: string}
    operator: is_empty

# Operator and type coverage.
- id: sex_not_equal_m
  title: Sex not equal to male
  intent: Test string inequality on an entity-backed column.
  scout_expected_count: 5
  condition:
    field: {kind: send_column, domain: DM, column: SEX, value_type: string}
    operator: ne
    value: M

- id: sex_in_female_or_male
  title: Sex in female or male
  intent: Test a typed string set with both observed values.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: DM, column: SEX, value_type: string}
    operator: in
    value: [F, M]

- id: sex_not_in_male
  title: Sex not in male
  intent: Test a negative typed string set without NULL values.
  scout_expected_count: 5
  condition:
    field: {kind: send_column, domain: DM, column: SEX, value_type: string}
    operator: not_in
    value: [M]

- id: strain_exact_match
  title: Exact Wistar Han match
  intent: Test exact equality on an entity-backed string column.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: DM, column: STRAIN, value_type: string}
    operator: eq
    value: WISTAR HAN

- id: lab_method_not_empty
  title: Subjects with a non-empty laboratory method
  intent: Compare is-not-empty with the existing is-empty case.
  scout_expected_count: 4
  condition:
    field: {kind: send_column, domain: LB, column: LBMETHOD, value_type: string}
    operator: is_not_empty

- id: ast_greater_or_equal_boundary
  title: AST at or above an observed boundary
  intent: Distinguish greater-or-equal from strict greater-than at an exact value.
  scout_expected_count: 4
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST
    - field: {kind: send_column, domain: LB, column: LBSTRESN, value_type: number}
      operator: gte
      value: 1.866058

- id: ast_less_than_boundary
  title: AST below an observed boundary
  intent: Test strict numeric less-than in one repeated-domain row group.
  scout_expected_count: 3
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST
    - field: {kind: send_column, domain: LB, column: LBSTRESN, value_type: number}
      operator: lt
      value: 1.866058

- id: ast_less_or_equal_boundary
  title: AST at or below an observed boundary
  intent: Distinguish less-or-equal from strict less-than at an exact value.
  scout_expected_count: 4
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST
    - field: {kind: send_column, domain: LB, column: LBSTRESN, value_type: number}
      operator: lte
      value: 1.866058

- id: ast_between_observed_bounds
  title: AST inside two observed bounds
  intent: Test inclusive numeric range semantics on one source row.
  scout_expected_count: 3
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST
    - field: {kind: send_column, domain: LB, column: LBSTRESN, value_type: number}
      operator: between
      value: [1.640942, 1.870901]

- id: ast_not_between_observed_bounds
  title: AST outside two observed bounds
  intent: Test negative inclusive range semantics on valid numeric rows.
  scout_expected_count: 4
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST
    - field: {kind: send_column, domain: LB, column: LBSTRESN, value_type: number}
      operator: not_between
      value: [1.640942, 1.870901]

- id: study_reference_timestamp
  title: Naive study reference-start timestamp
  intent: Test grit42 minute-precision normalization and naive-versus-aware comparison.
  scout_expected_count: 0
  condition:
    field: {kind: send_column, domain: DM, column: RFSTDTC, value_type: datetime}
    operator: eq
    value: "2020-06-16T04:00:00"

- id: not_ast_above_threshold
  title: Complement of same-row AST threshold
  intent: Test NOT around a multi-rule repeated-domain row predicate.
  scout_expected_count: 9
  condition:
    group: and
    negated: true
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST
    - field: {kind: send_column, domain: LB, column: LBSTRESN, value_type: number}
      operator: gt
      value: 1.8

- id: ast_and_threshold_mixed_boundary
  title: Direct AST rule and nested numeric group
  intent: Test a same-domain direct rule beside a nested subject-set boundary.
  scout_expected_count: 5
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: LB, column: LBTESTCD, value_type: string}
      operator: eq
      value: AST
    - group: and
      children:
      - field: {kind: send_column, domain: LB, column: LBSTRESN, value_type: number}
        operator: gt
        value: 1.8

# String-pattern, empty-value, and timestamp-boundary coverage.
- id: method_contains_histo
  title: Laboratory method contains HISTO
  intent: Test a positive contains match on non-null repeated-domain strings.
  scout_expected_count: 4
  condition:
    field: {kind: send_column, domain: LB, column: LBMETHOD, value_type: string}
    operator: contains
    value: HISTO

- id: method_not_contains_xyz
  title: Laboratory method does not contain XYZ
  intent: Test negative contains while excluding NULL source values.
  scout_expected_count: 4
  condition:
    field: {kind: send_column, domain: LB, column: LBMETHOD, value_type: string}
    operator: not_contains
    value: XYZ

- id: method_not_contains_histo
  title: Laboratory method does not contain HISTO
  intent: Distinguish a false negative-pattern rule from NULL matching.
  scout_expected_count: 0
  condition:
    field: {kind: send_column, domain: LB, column: LBMETHOD, value_type: string}
    operator: not_contains
    value: HISTO

- id: method_starts_with_immuno
  title: Laboratory method starts with IMMUNO
  intent: Test prefix matching on a repeated-domain string.
  scout_expected_count: 4
  condition:
    field: {kind: send_column, domain: LB, column: LBMETHOD, value_type: string}
    operator: starts_with
    value: IMMUNO

- id: method_ends_with_chemistry
  title: Laboratory method ends with CHEMISTRY
  intent: Test suffix matching on a repeated-domain string.
  scout_expected_count: 4
  condition:
    field: {kind: send_column, domain: LB, column: LBMETHOD, value_type: string}
    operator: ends_with
    value: CHEMISTRY

- id: derived_flag_zero_length
  title: Zero-length laboratory derived flag
  intent: Test is-empty against observed zero-length strings rather than NULL.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: LB, column: LBDRVFL, value_type: string}
    operator: is_empty

- id: derived_flag_not_empty
  title: Non-empty laboratory derived flag
  intent: Confirm that zero-length strings do not satisfy is-not-empty.
  scout_expected_count: 0
  condition:
    field: {kind: send_column, domain: LB, column: LBDRVFL, value_type: string}
    operator: is_not_empty

- id: reference_start_after_prior_day
  title: Reference start after a prior naive timestamp
  intent: Test timestamp ordering when grit42 authoring omits a source offset.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: DM, column: RFSTDTC, value_type: datetime}
    operator: gt
    value: "2020-06-15T04:00:00"

- id: reference_start_equal_utc_clock
  title: Reference start at the UTC clock value
  intent: Distinguish UTC interpretation from source wall-clock comparison.
  scout_expected_count: 0
  condition:
    field: {kind: send_column, domain: DM, column: RFSTDTC, value_type: datetime}
    operator: eq
    value: "2020-06-16T02:00:00"

- id: reference_start_after_utc_boundary
  title: Reference start after 03:00 on the source date
  intent: Distinguish the 02:00 UTC instant from the 04:00 source wall clock.
  scout_expected_count: 0
  condition:
    field: {kind: send_column, domain: DM, column: RFSTDTC, value_type: datetime}
    operator: gt
    value: "2020-06-16T03:00:00"

- id: reference_start_at_or_after_late_same_day
  title: Reference start at or after 05:00 on the same date
  intent: Detect date-grain inequality behavior independent of source time and offset.
  scout_expected_count: 0
  condition:
    field: {kind: send_column, domain: DM, column: RFSTDTC, value_type: datetime}
    operator: gte
    value: "2020-06-16T05:00:00"

- id: reference_start_at_or_before_early_same_day
  title: Reference start at or before 01:00 on the same date
  intent: Confirm date-grain inequality behavior in the opposite direction.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: DM, column: RFSTDTC, value_type: datetime}
    operator: lte
    value: "2020-06-16T01:00:00"

- id: reference_start_at_midnight
  title: Reference start at midnight on the recorded date
  intent: Confirm the catalogued grit42 saved-query source representation.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: DM, column: RFSTDTC, value_type: datetime}
    operator: eq
    value: "2020-06-16T00:00:00"
