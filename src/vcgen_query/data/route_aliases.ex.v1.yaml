# Reviewed delivery routes for the `route` derived field.
#
# The archive records one delivery mechanism with many spellings of EXROUTE and
# EXMETHOD ("ORAL GAVAGE", "Oral Gavage", and "ORAL" with EXMETHOD "GAVAGE" are
# all oral gavage). Each entry gives one canonical route and the exact source
# pairs that map to it. The `route` field selects a subject when one of its EX
# rows maps to the requested canonical route. A subject of a study without EX
# rows in a control arm takes the TS ROUTE values of its study instead; a TS
# value is a pair without a method, and the same entries cover it.
# `/vcgen/population` offers the canonical routes.
#
# Matching: EXROUTE and EXMETHOD are compared after whitespace collapse, trim,
# and upper-casing. A blank or missing EXMETHOD is `exmethod: null`. Only the
# exact (exroute, exmethod) pairs below match. A pair that is not in this file
# maps to no route, so it matches no route request. A missing EXROUTE maps to
# no route.
#
# `unmapped` lists pairs that were reviewed and must not map to a route, with
# the reason. `evidence` records the EX subjects and studies of the pair, the
# TS subjects and studies of the TS ROUTE value, and the raw spellings, in the
# reviewed source; it is review evidence only and does not change matching.
# The review covers every EX pair and every TS ROUTE value of the reviewed
# source.
#
# Review rule: when the source archive changes (`rodent_db_export.zip.dvc`),
# list the pairs that map to no route (see `route_alias_inventory`), add or
# reject each one here, and update `reviewed_source`. The file hash is part of
# the predicate fingerprint of each query that uses `route`.
contract: vcgen.route_aliases.v1
reviewed_source:
  archive: rodent_db_export.zip
  dvc_md5: 6b1a42fc119c2d537b6f4e0ec4cac262
analysis:
  inventory: >-
    Distinct EXROUTE and EXMETHOD pairs of the EX domain and distinct TS ROUTE
    values (a pair without a method), with EX and TS subject and study counts.
  rule: >-
    One canonical route per delivery mechanism. A route whose EXMETHOD names the
    mechanism (GAVAGE, BOLUS, INFUSION) maps to that mechanism. An oral route
    without a method maps to ORAL GAVAGE, by review decision: gavage is the
    usual oral mechanism of these studies. An intravenous route without a
    method maps to a separate "method not recorded" route, because bolus and
    infusion are both common. A pair whose route and method disagree is not
    mapped. A TS ROUTE value follows the same rule as a pair without a method.
    A TS value that names several routes, that is not a route, or that names a
    route without a canonical route here is not mapped.
routes:
