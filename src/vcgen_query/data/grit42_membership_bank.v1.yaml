contract: vcgen.grit42_membership_bank.v1
name: grit42-ui-supported-narrow-treatment
seed_study_id: "481152"
source_domains: [DM, EX, TS, LB]
scout_source_identity: grit42-study-slice-sha256:36380b33a1143d732cb13fba6026341e40e55eeedafbea9cd614edaf7a4aa188

# This first bank uses only the fields that are selected by default in a new
# Advanced query. The Columns tab can enable the wider field set recorded in
# grit42_endpoint_catalogue.v1.json. This exact treatment is rare: the live
# server returns ten subjects, all from the seed study. It anchors every case
# so server preview sets stay small.
base_rules:
- field: {kind: send_column, domain: EX, column: EXTRTV, value_type: string}
  operator: eq
  value: 0.5% w/v Methylcellulose 15cP in Milli-Q water

cases:
- id: baseline
  title: Full supported-field baseline
  intent: Confirm the rare treatment with all four matching select fields.
  scout_expected_count: 10
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: DM, column: SPECIES, value_type: string}
      operator: eq
      value: RAT
    - field: {kind: send_column, domain: DM, column: STRAIN, value_type: string}
      operator: eq
      value: WISTAR HAN
    - field: {kind: send_column, domain: EX, column: EXROUTE, value_type: string}
      operator: eq
      value: Oral
    - field: {kind: send_column, domain: EX, column: EXDOSFRQ, value_type: string}
      operator: eq
      value: QD

- id: treatment_only
  title: Exact rare treatment
  intent: Establish the common ten-subject anchor set.
  scout_expected_count: 10

- id: treatment_rat
  title: Treatment and rat
  intent: Test EX-to-DM subject intersection with a matching species.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: DM, column: SPECIES, value_type: string}
    operator: eq
    value: RAT

- id: treatment_mouse
  title: Treatment and mouse
  intent: Test EX-to-DM subject intersection with a false species branch.
  scout_expected_count: 0
  condition:
    field: {kind: send_column, domain: DM, column: SPECIES, value_type: string}
    operator: eq
    value: MOUSE

- id: treatment_wistar
  title: Treatment and Wistar Han
  intent: Test EX-to-DM subject intersection with the matching strain.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: DM, column: STRAIN, value_type: string}
    operator: eq
    value: WISTAR HAN

- id: treatment_oral
  title: Treatment and oral route
  intent: Test two matching predicates on repeated EX rows.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: EX, column: EXROUTE, value_type: string}
    operator: eq
    value: Oral

- id: treatment_qd
  title: Treatment and daily frequency
  intent: Test the supported EX dose-frequency selector.
  scout_expected_count: 10
  condition:
    field: {kind: send_column, domain: EX, column: EXDOSFRQ, value_type: string}
    operator: eq
    value: QD

- id: treatment_rat_or_mouse
  title: Treatment and rat or mouse
  intent: Test a nested OR with one true and one false species branch.
  scout_expected_count: 10
  condition:
    group: or
    children:
    - field: {kind: send_column, domain: DM, column: SPECIES, value_type: string}
      operator: eq
      value: RAT
    - field: {kind: send_column, domain: DM, column: SPECIES, value_type: string}
      operator: eq
      value: MOUSE

- id: treatment_rat_and_mouse
  title: Treatment and rat and mouse
  intent: Test a nested AND whose species branches are mutually exclusive.
  scout_expected_count: 0
  condition:
    group: and
    children:
    - field: {kind: send_column, domain: DM, column: SPECIES, value_type: string}
      operator: eq
      value: RAT
    - field: {kind: send_column, domain: DM, column: SPECIES, value_type: string}
      operator: eq
      value: MOUSE

- id: treatment_not_mouse
  title: Treatment and not mouse
  intent: Test a nested negated group without broadening the anchor set.
  scout_expected_count: 10
  condition:
    group: and
    negated: true
    children:
    - field: {kind: send_column, domain: DM, column: SPECIES, value_type: string}
      operator: eq
      value: MOUSE
