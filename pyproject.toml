[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcgen-query"
version = "0.4.0a0"
description = "Local SEND cohort-query library for the VICT3R virtual-control project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "VICT3R" }]
keywords = ["send", "cdisc", "cohort", "query", "toxicology", "virtual-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The query library declares only what its public API needs. The scientific
# modelling stack (NumPy, scikit-learn, torch, ...) is intentionally absent: a
# collaborator can install this wheel and select a SEND cohort without it.
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "ipykernel>=6.29",
    "jsonschema>=4.25",
    "nbclient>=0.10",
    "pytest>=8.0",
    "ruff>=0.15.20,<0.16",
    "ucumvert>=0.3.2,<0.4",
]

[project.urls]
Documentation = "https://github.com/VICT3Rproject/vcgen-query#readme"
Issues = "https://github.com/VICT3Rproject/vcgen-query/issues"
Repository = "https://github.com/VICT3Rproject/vcgen-query"

[tool.hatch.build.targets.wheel]
packages = ["src/vcgen_query"]

[tool.hatch.build.targets.wheel.force-include]
# Keep the editable notebook sources in the wheel. Do not include the complete
# directory: local SEND extracts use ``.vcgen_query_cache`` below it.
"notebooks/02_editable_cohort_query.ipynb" = "vcgen_query/notebooks/02_editable_cohort_query.ipynb"
"GRIT42_SAVED_QUERY_GUIDE.md" = "vcgen_query/GRIT42_SAVED_QUERY_GUIDE.md"

[tool.hatch.build.targets.sdist]
include = [
    "/.vscode/settings.json",
    "/GRIT42_SAVED_QUERY_GUIDE.md",
    "/notebooks/02_editable_cohort_query.ipynb",
    "/src/vcgen_query",
    "/README.md",
    "/pyproject.toml",
]
exclude = [
    "/.cache",
    "/.venv",
    "/.pytest_cache",
    "/build",
    "/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
